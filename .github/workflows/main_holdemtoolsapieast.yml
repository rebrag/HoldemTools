# Deploys the backend (backend/) to Azure App Service "holdemtoolsapieast".
# Uses a publish profile (basic auth) stored in the AZURE_WEBAPP_PUBLISH_PROFILE
# repo secret. Builds from the backend/ subfolder and only runs on backend changes.
#
# build -> migrate -> deploy, in that order and each gated on the last. The
# schema has to be in place BEFORE the code that expects it starts serving:
# deploying first leaves every request that touches the new column failing
# until someone remembers to run the migration by hand. Additive migrations
# are safe against the running old code, so the reverse order is the one that
# costs nothing.
#
# Requires the AZURE_SQL_CONNECTION_STRING repo secret, and a database
# firewall that admits GitHub-hosted runners (their IPs are dynamic).
name: Build and deploy ASP.Net Core app to Azure Web App - holdemtoolsapieast

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_holdemtoolsapieast.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build backend/HoldemToolsAPI.sln --configuration Release

      # Publish the API project specifically (not the .sln) so the test project
      # is excluded from the deployment package.
      - name: dotnet publish
        run: dotnet publish backend/GTOLiteAPI.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  migrate:
    runs-on: windows-latest
    needs: build

    steps:
      # First, and before the checkout: an unset secret expands to an empty
      # string, which SqlClient reports four minutes later as "The
      # ConnectionString property has not been initialized" from the bottom of
      # a stack trace. Name the real problem in seconds instead.
      - name: Check the connection string secret is set
        shell: bash
        env:
          CONN: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: |
          if [ -z "$CONN" ]; then
            echo "::error::AZURE_SQL_CONNECTION_STRING is not set, so migrations cannot run and the deploy will be skipped. Add it under Settings > Secrets and variables > Actions (same value as the App Service ConnectionStrings:DefaultConnection)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # Pinned to the project's EF Core major (8.0.22): the tool has to be at
      # least the runtime version, and a newer major would quietly generate a
      # snapshot the project can't read.
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 8.*

      # Idempotent by construction - EF skips every migration already in
      # __EFMigrationsHistory - so a redeploy with no new migrations is a
      # no-op rather than a risk. A failure here stops the deploy.
      - name: Apply database migrations
        run: dotnet ef database update --project backend/GTOLiteAPI.csproj --configuration Release --connection "${{ secrets.AZURE_SQL_CONNECTION_STRING }}"

  deploy:
    runs-on: windows-latest
    needs: [build, migrate]

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'holdemtoolsapieast'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
