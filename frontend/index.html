<!doctype html>
<html lang="en">
  <head>
    <!-- public/index.html -->
    <!-- monorepo deploy test: 2026-07-15 (v2) -->
    <!-- served from HoldemTools monorepo (frontend/) -->
    <meta name="deploy-source" content="holdemtools-monorepo-v2" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load the font stylesheet without blocking first paint: media="print"
         defers it, onload swaps it in once fetched. -->
    <link href="https://fonts.googleapis.com/css2?family=Unica+One&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Unica+One&display=swap" rel="stylesheet"></noscript>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The chip at the centre of <LoadingIndicator>. Warmed here so the first
         loader that renders has it, instead of spinning an empty ring while the
         image is fetched. -->
    <link rel="preload" as="image" href="/logo-loader.png" />
    <title>HoldemTools</title>
    <meta name="theme-color" content="#020617" />
    <style>
      /* Pre-boot loader. Visible from first paint until React mounts and
         replaces #root, which covers the window where the entry bundle (React,
         Firebase, the shell) is still downloading and the page would otherwise
         be blank. Inline on purpose: anything it had to fetch would compete
         with the bundle it exists to cover for. The one exception is the logo
         mark, which is also the favicon, so on the loads where this screen
         matters most (a revisit, or iOS Safari re-snapshotting a jettisoned
         tab for its tab-switcher preview) it comes straight from cache. The
         wordmark keeps the screen branded even if that image is cold. */
      @keyframes ht-preboot-spin { to { transform: rotate(360deg); } }
      #ht-preboot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        /* Dark slate + a faint emerald wash, matching AuroraBackground. */
        background:
          radial-gradient(120vw 80vh at 50% -20%, rgba(16, 185, 129, 0.14), transparent 60%),
          #020617;
      }
      #ht-preboot .ht-preboot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #ht-preboot img {
        width: 40px;
        height: 40px;
        display: block;
      }
      #ht-preboot span {
        font: 600 22px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: -0.02em;
        color: #f8fafc;
      }
      #ht-preboot i {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid rgba(52, 211, 153, 0.3);
        border-top-color: #34d399;
        animation: ht-preboot-spin 1s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        #ht-preboot i { animation: none; opacity: 0.6; }
      }
    </style>
  </head>
  <body class="">
    <div id="root">
      <div id="ht-preboot" role="status" aria-label="Loading HoldemTools">
        <div class="ht-preboot-brand">
          <img src="/logo-icon.png" alt="" width="40" height="40" />
          <span>HoldemTools</span>
        </div>
        <i></i>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
